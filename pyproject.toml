[project]
name = "omnibox-agent"
version = "0.1.0"
description = "OmniHub Ask Agent - RAG smart Q&A service with hybrid retrieval"
requires-python = ">=3.11.1"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.2.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "jieba>=0.42.1",
    "apscheduler>=3.10.0",
    "mcp>=1.2.0",
]

[tool.setuptools.packages.find]
include = ["omnibox_agent*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"
